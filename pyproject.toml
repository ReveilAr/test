[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ms"
version = "0.1.0"
description = "ATLAS-MS: LC-MS/MS feature-based molecular networking and lipid-focused annotation"
readme = "README.md"
# pyopenms-viz (used by the app) needs Python >= 3.12; MS2LDA does not support 3.13 yet.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyopenms==3.5.0",  # pinned: the pyOpenMS API changes between releases
    "snakemake>=9,<10",
    "param>=2.1,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlas-ms = "atlas_ms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas_ms = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
