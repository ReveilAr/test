[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ms"
version = "0.1.0"
description = "ATLAS-MS: LC-MS/MS feature-based molecular networking and lipid-focused annotation"
readme = "README.md"
# pyopenms-viz (used by the app) needs Python >= 3.12; MS2LDA does not support 3.13 yet.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyopenms==3.5.0",  # pinned: the pyOpenMS API changes between releases
    "snakemake>=9,<10",
    "param>=2.1,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "pyyaml>=6",
    # Molecular networking
    "matchms>=0.33,<0.34",  # 0.33 renamed ModifiedCosine to ModifiedCosineGreedy
    "ms2deepscore>=2.11,<3",
    "onnxruntime",  # imported by ms2deepscore 2.11 but not declared by it
    "networkx>=3.4",
    # App
    "panel>=1.9,<2",  # widget "label" / button "color" (1.9 names)
    "holoviews>=1.20",
    "bokeh>=3.6",
    "colorcet>=3",  # network family colours (also a HoloViews dependency)
    "pyopenms-viz>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlas-ms = "atlas_ms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas_ms = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
